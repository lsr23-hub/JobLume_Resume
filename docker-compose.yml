services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # ⚠️ **默认只绑回环**：这个应用的数据（姓名、联系方式、完整经历）就在下面的目录里，
      # 不该一上来就对局域网/公网敞开。要让别的机器访问，改这一行 —— 但先加一层认证，
      # 见 README「部署」。
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      # 前面挂了反向代理就打开它，否则所有请求会被当成同一个来源共用一个限流额度。
      # compose 这里是直接暴露端口，所以默认不设。详见 README「部署」。
      # - TRUST_PROXY=1
      # ⚠️ 存档端点的硬开关，**默认关**。这个应用的数据就存在那里，关掉它 = 应用不可用，
      # 所以自建部署必须显式打开。反过来说：把这份 compose 原样发到公网（改掉上面的
      # 回环绑定），等于公开所有使用者的姓名、联系方式与经历。
      - SAVES_ENABLED=1
      # 存档目录的父目录（存档落在 <它>/saves/）
      - SAVES_ROOT=/data
    volumes:
      # **bind mount 而不是命名卷**：这个应用的心智模型是「文件夹就是我的数据」——
      # 用户要能直接在宿主机上看到它、拷走它、放进自己的备份。
      # 换成命名卷就把那件事藏起来了。
      #
      # ⚠️ 容器以 uid 1001（见 Dockerfile）运行，所以这个目录要让它写得进去：
      #     mkdir -p saves && chmod 777 saves      # 或者把 Dockerfile 里的 uid 改成你的
      - ./saves:/data/saves
    restart: always
