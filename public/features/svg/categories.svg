<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 类别标签依次贴上，对应「自动归类」 */
    @keyframes tag-in {
      0% { transform: translateX(-14px); opacity: 0; }
      12% { transform: translateX(0); opacity: 1; }
      80% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(-14px); opacity: 0; }
    }
    .tag-1 { animation: tag-in 4.5s ease-in-out infinite; }
    .tag-2 { animation: tag-in 4.5s ease-in-out infinite; animation-delay: 1.5s; }
    .tag-3 { animation: tag-in 4.5s ease-in-out infinite; animation-delay: 3s; }
  </style>

  <!-- 背景卡片 -->
  <rect x="80" y="50" width="240" height="200" rx="12" fill="#F9F9F7" stroke="#E6E6E3" stroke-width="2"/>
  <rect x="80" y="50" width="240" height="30" rx="12" fill="#F2F0E9" fill-opacity="0.5"/>
  <rect x="80" y="70" width="240" height="10" fill="#F2F0E9" fill-opacity="0.5"/>
  <circle cx="100" cy="65" r="4" fill="#E6E6E3"/>
  <circle cx="115" cy="65" r="4" fill="#E6E6E3"/>

  <!-- 三条经历 -->
  <g>
    <rect x="100" y="94" width="200" height="32" rx="6" fill="#F2F0E9" stroke="#E6E6E3" stroke-width="2"/>
    <rect x="140" y="103" width="96" height="6" rx="2" fill="#1B1B18" fill-opacity="0.4"/>
    <rect x="140" y="114" width="64" height="6" rx="2" fill="#1B1B18" fill-opacity="0.2"/>

    <rect x="100" y="134" width="200" height="32" rx="6" fill="#F2F0E9" stroke="#E6E6E3" stroke-width="2"/>
    <rect x="140" y="143" width="112" height="6" rx="2" fill="#1B1B18" fill-opacity="0.4"/>
    <rect x="140" y="154" width="72" height="6" rx="2" fill="#1B1B18" fill-opacity="0.2"/>

    <rect x="100" y="174" width="200" height="32" rx="6" fill="#F2F0E9" stroke="#E6E6E3" stroke-width="2"/>
    <rect x="140" y="183" width="88" height="6" rx="2" fill="#1B1B18" fill-opacity="0.4"/>
    <rect x="140" y="194" width="56" height="6" rx="2" fill="#1B1B18" fill-opacity="0.2"/>
  </g>

  <!-- 贴上来的类别标签 -->
  <g>
    <rect x="108" y="103" width="24" height="14" rx="7" fill="#1B1B18" class="tag-1"/>
    <rect x="108" y="143" width="24" height="14" rx="7" fill="#1B1B18" class="tag-2"/>
    <rect x="108" y="183" width="24" height="14" rx="7" fill="#1B1B18" class="tag-3"/>
  </g>
</svg>
