name: Deploy to Cloudflare

# 只在手动触发时跑。
#
# 原来还挂着 push: branches: [main] —— 也就是往仓库推任何一次提交都会
# 尝试部署到 Cloudflare。对这个 fork 来说部署目标还没定下来，而且
# 仓库里未必配了 CLOUDFLARE_API_TOKEN / ACCOUNT_ID，自动跑的结果大概率是
# 每次推送都留一个失败记录。确认要迁到 Cloudflare 之后，把下面注释掉的两行放开。
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
