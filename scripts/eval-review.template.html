<title>匹配标注复核</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bar-h: 104px;
    --ground: #f4f3ef;
    --surface: #fbfaf7;
    --surface-2: #eceae4;
    --ink: #1b1e1c;
    --ink-2: #565c58;
    --ink-3: #8a8f8a;
    --line: #dedbd3;
    --line-strong: #c8c4ba;
    --accent: #1d5c4c;
    --accent-soft: #e2ebe7;
    --rule: #1b1e1c;
    --warn: #9a4a1e;
    --r0: #a9a79f;
    --r1: #8aa79b;
    --r2: #3f7a66;
    --r3: #14453a;
    --on-r0: #ffffff;
    --on-r1: #ffffff;
    --on-r2: #ffffff;
    --on-r3: #ffffff;
    --shadow: 0 1px 2px rgba(27, 30, 28, .06), 0 8px 24px -16px rgba(27, 30, 28, .3);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15181a;
      --surface: #1c2022;
      --surface-2: #24282a;
      --ink: #e6e8e4;
      --ink-2: #a2a8a3;
      --ink-3: #757b77;
      --line: #2e3335;
      --line-strong: #3d4345;
      --accent: #63b79b;
      --accent-soft: #1e2c28;
      --rule: #e6e8e4;
      --warn: #d08a5a;
      --r0: #5f5f59;
      --r1: #64867a;
      --r2: #47997f;
      --r3: #7fcdb1;
      --on-r0: #15181a;
      --on-r1: #15181a;
      --on-r2: #15181a;
      --on-r3: #15181a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    --ground: #15181a;
    --surface: #1c2022;
    --surface-2: #24282a;
    --ink: #e6e8e4;
    --ink-2: #a2a8a3;
    --ink-3: #757b77;
    --line: #2e3335;
    --line-strong: #3d4345;
    --accent: #63b79b;
    --accent-soft: #1e2c28;
    --rule: #e6e8e4;
    --warn: #d08a5a;
    --r0: #5f5f59;
    --r1: #64867a;
    --r2: #47997f;
    --r3: #7fcdb1;
    --on-r0: #15181a;
    --on-r1: #15181a;
    --on-r2: #15181a;
    --on-r3: #15181a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", monospace; font-variant-numeric: tabular-nums; }

  /* ── 顶栏 ── */
  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);

  .bar-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 14px 20px 0;
    display: flex;

  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }

  /* ── 右：列表 ── */
  /* 吸顶：列表很长时，预算控件和「几条进简历」得一直看得见 */

    position: sticky; top: var(--bar-h); z-index: 20;

    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;

  .card-sub { font-size: 12.5px; color: var(--ink-2); margin: 0; }
  .card-date { font-size: 11.5px; color: var(--ink-3); }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .scale { display: flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }

  /* ── 导出 ── */

  .dock[data-show="true"] { display: block; }
  .dock-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dock-text { font-size: 13px; color: var(--ink-2); }
  .dock-text b { color: var(--ink); }
  .btn {

<header class="bar">
  <div class="bar-inner">
    <div class="brand">
      <h1>匹配标注复核</h1>
      <span class="brand-sub">核心链路评测 · 人工金标准</span>
      <span class="brand-count mono" id="progress"></span>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
</header>

<main>
  <aside class="jd" id="jd"></aside>
  <section>
    <div class="list-head">
      <h2 id="list-title"></h2>
      <span class="list-stat" id="list-stat"></span>
      <span class="budget" id="budget-row"></span>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<div class="dock" id="dock">
  <div class="dock-inner">
    <span class="dock-text" id="dock-text"></span>
    <div class="dock-right">
      <button class="btn btn-ghost" id="reset">撤销全部改动</button>
      <button class="btn btn-primary" id="export">导出改动</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h3>改动的标注</h3>
      <p>把这段贴回给 Claude，我来更新数据集。</p>
      <button class="btn" id="copy" style="margin-left:auto">复制</button>
      <button class="btn btn-ghost" id="close">关闭</button>
    </div>
    <textarea id="sheet-text" readonly spellcheck="false"></textarea>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;
const TH = DATA.recommendThreshold;
const LEVELS = [
  { v: 0, label: "不相关" },
  { v: 1, label: "弱相关" },
  { v: 2, label: "相关" },
  { v: 3, label: "决定性" },
];
const KEY = "eval-review-edits";

/* localStorage 可能不可用（无痕、被清理），读写都兜住 —— 页面照常工作，只是不记忆 */
const readEdits = () => {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch { return {}; }
};
const writeEdits = (v) => {
  try { localStorage.setItem(KEY, JSON.stringify(v)); } catch { /* 忽略 */ }
};

let edits = readEdits();
let current = DATA.cases[0].id;

const baseOf = (caseId) => DATA.cases.find((c) => c.id === caseId);

const budgetOf = (caseId) => {
  const o = edits[caseId]?.__budget;
  return typeof o === "number" ? o : baseOf(caseId).budget;
};

/*
 * 理想集合的派生规则，必须与 src/eval/dataset/index.ts 的 deriveIdealSelection 一致：
 * 关键经历优先占位，剩下的名额按相关度降序补足。两处若走偏，页面显示的和评测算的
 * 就不是一回事了 —— 改一处时记得改另一处。
 */
const deriveIdeal = (entities, budget) => {
  // 用 id 不用标题 —— 「上海交通大学」在教育经历和校园经历里各有一条，
  // 按标题建集合会塌掉一条，条数和成员都算错
  const pinned = entities.filter((e) => e.mustHave).sort((a, b) => a.id.localeCompare(b.id));
  const rest = entities
    .filter((e) => !e.mustHave)
    .sort((a, b) => b.relevance - a.relevance || a.id.localeCompare(b.id));
  return new Set([...pinned, ...rest].slice(0, budget).map((e) => e.id));
};
const eff = (caseId, e) => {
  const o = edits[caseId]?.[e.id];
  return o ? { ...e, ...o } : e;
};
const changedCount = () =>
  Object.values(edits).reduce(
    (s, m) => s + Object.keys(m).filter((k) => k !== "__budget").length + (m.__budget !== undefined ? 1 : 0),
    0
  );
const caseDirty = (caseId) => Object.keys(edits[caseId] || {}).length > 0;

function setBudget(caseId, value) {
  const n = Math.max(1, Math.min(50, Math.round(value)));
  const map = { ...(edits[caseId] || {}) };
  if (n === baseOf(caseId).budget) delete map.__budget;
  else map.__budget = n;
  if (Object.keys(map).length === 0) delete edits[caseId];
  else edits[caseId] = map;
  writeEdits(edits);
  render();
}

function setVal(caseId, entId, key, value) {
  const base = baseOf(caseId).entities.find((e) => e.id === entId);
  const map = { ...(edits[caseId] || {}) };
  const next = { ...(map[entId] || {}), [key]: value };
  // 改回原值就不算改动
  if (next.relevance === base.relevance) delete next.relevance;
  if ((next.mustHave || false) === base.mustHave) delete next.mustHave;
  if (Object.keys(next).length === 0) delete map[entId];
  else map[entId] = next;
  if (Object.keys(map).length === 0) delete edits[caseId];
  else edits[caseId] = map;
  writeEdits(edits);
  render();
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  DATA.cases.forEach((c) => {
    const b = document.createElement("button");
    b.className = "tab";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(c.id === current));
    b.dataset.dirty = String(caseDirty(c.id));
    b.innerHTML = `<span>${c.id}</span><span class="tab-dot"></span>`;
    b.onclick = () => { current = c.id; render(); window.scrollTo({ top: 0 }); };
    tabs.appendChild(b);
  });
}

function renderJD(c) {
  const jd = document.getElementById("jd");
  const req = (title, arr, gap) => arr.length
    ? `<div class="req-group"><div class="req-label">${title}</div><ul class="req-list${gap ? " gap" : ""}">${arr.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`
    : "";
  // 桌面端 JD 常驻，窄屏折叠 —— 判断一次即可，窗口尺寸变化不影响复核
  const wide = window.matchMedia("(min-width: 901px)").matches;
  jd.innerHTML = `
    <details class="jd-details"${wide ? " open" : ""}>
    <summary class="jd-summary">
      <span class="jd-summary-text">${esc(c.jd.position)}</span>
      <span class="jd-summary-co">${esc(c.jd.company)}</span>
      <span class="jd-summary-cue">展开 JD 与要求</span>
    </summary>
    <div class="jd-body">
    <div class="jd-card">
      <p class="jd-role">${esc(c.jd.position)}</p>
      <p class="jd-co mono">${esc(c.jd.company)} · ${esc(c.profile)}</p>
      <p class="jd-note">${esc(c.note)}</p>
      <div class="meta-row">${c.dimensions.map((d) => `<span class="tag">${esc(d)}</span>`).join("")}</div>
      <div class="jd-text">${esc(c.jd.jdRaw)}</div>
    </div>
    <div class="jd-card">
      <div class="req-label">人工拆出的 JD 要求</div>
      ${req("硬性", c.requirements.must)}
      ${req("加分项", c.requirements.nice)}
      ${req("职责", c.requirements.responsibility)}
      ${req("档案里没有的", c.missingSkills, true)}
    </div>
    </div></details>`;
}

function renderList(c) {
  const list = document.getElementById("list");
  const items = c.entities.map((e) => eff(c.id, e));
  const budget = budgetOf(c.id);
  const ideal = deriveIdeal(items, budget);

  // 进简历的排前面，于是预算线正好落在切口上 —— 线以上即简历内容
  const sorted = [...items].sort((a, b) => {
    const ia = ideal.has(a.id), ib = ideal.has(b.id);
    if (ia !== ib) return ia ? -1 : 1;
    return b.relevance - a.relevance || a.id.localeCompare(b.id);
  });

  const pinned = items.filter((i) => i.mustHave).length;
  const tooMany = pinned > budget;
  document.getElementById("list-title").textContent = `${c.id} · ${c.entities.length} 条经历`;
  document.getElementById("list-stat").innerHTML =
    `其中 <b>${ideal.size}</b> 条进简历`;
  document.getElementById("budget-row").innerHTML = `
    <span>一页放得下</span>
    <input id="budget-input" type="number" min="1" max="50" value="${budget}" aria-label="一页能放几条">
    <span>条${pinned ? ` · 其中 ${pinned} 条标了必须进` : ""} · 相关度达标的 ${items.filter((i) => i.relevance >= TH).length} 条</span>
    ${tooMany ? `<span class="budget-note">关键经历比预算还多，请调高预算</span>` : ""}`;
  const input = document.getElementById("budget-input");
  input.onchange = () => setBudget(c.id, Number(input.value));

  list.innerHTML = "";
  sorted.forEach((e, i) => {
    if (i === ideal.size && ideal.size > 0) {
      const r = document.createElement("div");
      r.className = "rule";
      r.innerHTML = `<span>预算线 · 以上 ${ideal.size} 条进简历</span>`;
      list.appendChild(r);
    }
    list.appendChild(card(c.id, e, ideal.has(e.id)));
  });
}

function card(caseId, e, inResume) {
  const el = document.createElement("article");
  el.className = "card";
  el.style.setProperty("--ramp", `var(--r${e.relevance})`);
  el.style.setProperty("--on-ramp", `var(--on-r${e.relevance})`);
  const isChanged = Boolean(edits[caseId]?.[e.id]);
  el.dataset.changed = String(isChanged);
  el.dataset.rel = String(e.relevance);

  // 「进简历」由理想集合决定，不是相关度 —— 关键经历即使相关度低也照样进
  const derived = inResume
    ? (e.mustHave ? "进简历 · 必须进" : "进简历")
    : "不进简历";

  el.innerHTML = `
    <div class="gauge"></div>
    <div class="card-body">
      <div class="card-head">
        <span class="sect">${esc(e.section)}</span>
        <h3 class="card-title">${esc(e.title)}</h3>
        ${e.dateRange ? `<span class="card-date mono">${esc(e.dateRange)}</span>` : ""}
      </div>
      ${e.subtitle ? `<p class="card-sub">${esc(e.subtitle)}</p>` : ""}
      ${e.description ? `<p class="card-desc">${esc(e.description)}</p>` : ""}
      ${e.reason ? `<p class="card-reason"><span class="rl">标注理由</span>${esc(e.reason)}</p>` : ""}
      <div class="controls">
        <div class="scale" role="group" aria-label="相关度">
          ${LEVELS.map((l) => `<button data-v="${l.v}" aria-pressed="${e.relevance === l.v}">${l.v} ${l.label}</button>`).join("")}
        </div>
        <button class="star" aria-pressed="${Boolean(e.mustHave)}" title="无论相关度排第几，都必须放进简历">★ 必须进</button>
        <span class="derived">${derived}${isChanged ? " · 已改" : ""}</span>
      </div>
    </div>`;

  el.querySelectorAll(".scale button").forEach((b) => {
    b.onclick = () => setVal(caseId, e.id, "relevance", Number(b.dataset.v));
  });
  el.querySelector(".star").onclick = () => setVal(caseId, e.id, "mustHave", !e.mustHave);
  return el;
}

function renderDock() {
  const n = changedCount();
  document.getElementById("dock").dataset.show = String(n > 0);
  document.getElementById("dock-text").innerHTML =
    `已改动 <b>${n}</b> 条判定`;
  const total = DATA.cases.reduce((s, c) => s + c.entities.length, 0);
  document.getElementById("progress").textContent = `${total} 条待复核`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
}

function render() {
  const c = baseOf(current);
  renderTabs();
  renderJD(c);
  renderList(c);
  renderDock();
}

document.getElementById("export").onclick = () => {
  document.getElementById("sheet-text").value = JSON.stringify(edits, null, 2);
  document.getElementById("sheet").dataset.show = "true";
};
document.getElementById("close").onclick = () => {
  document.getElementById("sheet").dataset.show = "false";
};
document.getElementById("copy").onclick = async (ev) => {
  const ta = document.getElementById("sheet-text");
  try {
    await navigator.clipboard.writeText(ta.value);
    ev.target.textContent = "已复制";
    setTimeout(() => { ev.target.textContent = "复制"; }, 1600);
  } catch {
    ta.select();
  }
};
document.getElementById("reset").onclick = () => {
  if (!confirm("撤销全部改动？此操作不可恢复。")) return;
  edits = {};
  writeEdits(edits);
  render();
};

/* 顶栏高度随换行变化（窄屏尤其），量一次写进变量 —— 吸顶元素靠它对齐 */
function syncBarHeight() {
  const h = document.querySelector(".bar").getBoundingClientRect().height;
  document.documentElement.style.setProperty("--bar-h", `${Math.round(h)}px`);
}
window.addEventListener("resize", syncBarHeight);

render();
syncBarHeight();
</script>
